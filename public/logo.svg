<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2A1D" />
      <stop offset="100%" stop-color="#06160F" />
    </linearGradient>

    <!-- Gold Wave Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3C35C" />
      <stop offset="100%" stop-color="#D99420" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52B788" />
      <stop offset="100%" stop-color="#2D6A4F" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Badge Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#2D6A4F" stroke-width="1.5" />

  <!-- Outer Sound Pulse Rings -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#52B788" stroke-width="1" opacity="0.18" />
  <circle cx="32" cy="32" r="18" fill="none" stroke="#F3C35C" stroke-width="1" opacity="0.25" />

  <!-- Dynamic Equalizer / Voice Waveform Bars -->
  <g filter="url(#glow)">
    <!-- Bar 1 (Leftmost) -->
    <rect x="14" y="27" width="3.5" height="10" rx="1.75" fill="url(#emeraldGrad)" />
    
    <!-- Bar 2 -->
    <rect x="20.5" y="21" width="3.5" height="22" rx="1.75" fill="url(#emeraldGrad)" />

    <!-- Center Mic / Core Wave (Golden Center) -->
    <rect x="27" y="14" width="4.5" height="36" rx="2.25" fill="url(#goldGrad)" />
    <rect x="33.5" y="14" width="4.5" height="36" rx="2.25" fill="url(#goldGrad)" />

    <!-- Bar 4 -->
    <rect x="41" y="21" width="3.5" height="22" rx="1.75" fill="url(#emeraldGrad)" />

    <!-- Bar 5 (Rightmost) -->
    <rect x="47.5" y="27" width="3.5" height="10" rx="1.75" fill="url(#emeraldGrad)" />
  </g>

  <!-- Central Intelligence AI Sparkle Nodes -->
  <circle cx="32.5" cy="32" r="2.2" fill="#FFFFFF" opacity="0.9" />
  <circle cx="22.25" cy="32" r="1.2" fill="#FFFFFF" opacity="0.7" />
  <circle cx="42.75" cy="32" r="1.2" fill="#FFFFFF" opacity="0.7" />
</svg>
